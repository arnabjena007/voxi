    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="landing">
      <div class="landing-page landing-page--minimal">
        <div class="landing-topbar">
          <span class="landing-topbar-text">0 - 9: COLORS, CLICK: ADD VOXEL, SHIFT + CLICK: REMOVE VOXEL</span>
          <div class="voxel-color-strip" aria-label="Voxel colors">
            <button type="button" class="voxel-color is-active" data-voxel-color="0" style="--voxel-color:#ef4444" aria-label="Color 0">0</button>
            <button type="button" class="voxel-color" data-voxel-color="1" style="--voxel-color:#f97316" aria-label="Color 1">1</button>
            <button type="button" class="voxel-color" data-voxel-color="2" style="--voxel-color:#facc15" aria-label="Color 2">2</button>
            <button type="button" class="voxel-color" data-voxel-color="3" style="--voxel-color:#84cc16" aria-label="Color 3">3</button>
            <button type="button" class="voxel-color" data-voxel-color="4" style="--voxel-color:#14b8a6" aria-label="Color 4">4</button>
            <button type="button" class="voxel-color" data-voxel-color="5" style="--voxel-color:#38bdf8" aria-label="Color 5">5</button>
            <button type="button" class="voxel-color" data-voxel-color="6" style="--voxel-color:#6366f1" aria-label="Color 6">6</button>
            <button type="button" class="voxel-color" data-voxel-color="7" style="--voxel-color:#ec4899" aria-label="Color 7">7</button>
            <button type="button" class="voxel-color" data-voxel-color="8" style="--voxel-color:#a16207" aria-label="Color 8">8</button>
            <button type="button" class="voxel-color" data-voxel-color="9" style="--voxel-color:#f5f5f4" aria-label="Color 9">9</button>
          </div>
        </div>
        <div class="landing-canvas-shell">
          <canvas class="landing-voxel-canvas" id="landingVoxelCanvas" aria-label="Interactive voxel building plane"></canvas>
        </div>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
